services:
  postgres:
    image: postgres:18.6-alpine3.24@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    environment:
      POSTGRES_DB: blaxsmith
      POSTGRES_USER: blaxsmith
      POSTGRES_PASSWORD: ${BLAXSMITH_DEV_DB_PASSWORD:?Set BLAXSMITH_DEV_DB_PASSWORD in .env}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    ports:
      - "127.0.0.1:55434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blaxsmith -d blaxsmith"]
      interval: 2s
      timeout: 2s
      retries: 20

volumes:
  postgres_data:
