version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/mjtechguy/blaxsmith/gen/go
plugins:
  - remote: buf.build/protocolbuffers/go:v1.36.12
    out: gen/go
    opt: paths=source_relative
  - remote: buf.build/connectrpc/go:v1.21.0
    out: gen/go
    opt: paths=source_relative
  - remote: buf.build/bufbuild/es:v2.15.0
    out: frontend/src/gen
    opt: target=ts
inputs:
  - directory: proto
