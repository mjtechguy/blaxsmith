name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.6-alpine3.24@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_DB: blaxsmith
          POSTGRES_USER: blaxsmith
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U blaxsmith -d blaxsmith"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      # The tool adapter runs harnesses inside tmux; its tests skip without it.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tmux
      # Tests connect as an ordinary role, like the app, so row-level security
      # (db/migrations/0140_tenant_rls.sql) applies; a superuser bypasses it.
      - run: |
          psql -v ON_ERROR_STOP=1 -c "CREATE ROLE blaxsmith_app LOGIN PASSWORD 'ci-only-app-password' NOSUPERUSER NOBYPASSRLS" \
            -c "GRANT CREATE ON DATABASE blaxsmith TO blaxsmith_app"
        env:
          PGHOST: 127.0.0.1
          PGUSER: blaxsmith
          PGPASSWORD: ci-only-password
          PGDATABASE: blaxsmith
      - run: make check
        env:
          BLAXSMITH_TEST_DATABASE_URL: postgres://blaxsmith_app:ci-only-app-password@127.0.0.1:5432/blaxsmith?sslmode=disable
      - run: make example

  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: make web-check
      - run: make proto-check

  security:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      # GO-2026-6443 (grpc xDS server panic, fixed only in grpc v1.85.0-dev) is
      # reachable solely through internal/terminal/terminaltest, a test fake
      # that runs grpc.Server. Scan everything else; revert to ./... once
      # google.golang.org/grpc >= v1.85.0 is released and adopted.
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 $(go list ./... | grep -v /internal/terminal/terminaltest)
      - run: go run github.com/securego/gosec/v2/cmd/gosec@v2.29.0 -quiet -exclude-dir=gen -exclude-dir=deploy/dev ./...
      - name: Scan complete Git history for secrets
        run: |
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact=100 .
