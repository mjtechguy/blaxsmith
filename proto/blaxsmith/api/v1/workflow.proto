syntax = "proto3";

package blaxsmith.api.v1;

message Project {
  string id = 1;
  string slug = 2;
  string name = 3;
  string created_at = 4; // RFC 3339.
}

message Run {
  string id = 1;
  string project_id = 2;
  string launch_key = 3;
  string source_commit = 4;
  string bundle_sha256 = 5;
  string verification_sha256 = 6;
  string state = 7;
  string created_at = 8; // RFC 3339.
}

message WorkflowEvent {
  int64 id = 1;
  string run_id = 2;
  string task_id = 3;
  string attempt_id = 4;
  string kind = 5;
  string occurred_at = 6; // RFC 3339.
  string payload_json = 7; // JSON object for attempt.progress; empty otherwise.
}

message CreateProjectRequest {
  string slug = 1;
  string name = 2;
}
message CreateProjectResponse { Project project = 1; }

message GetProjectRequest { string project_id = 1; }
message GetProjectResponse { Project project = 1; }

message ProjectSource {
  string project_id = 1;
  string repository_url = 2; // GitHub or GitLab HTTPS repository.
  string ref = 3; // Empty selects the remote default branch.
  string updated_at = 4; // RFC 3339.
  // Organization Git connection for a private repository; empty = public.
  string git_connection_id = 5;
}
message GetProjectSourceRequest { string project_id = 1; }
message GetProjectSourceResponse { ProjectSource source = 1; }
message SetProjectSourceRequest {
  string project_id = 1;
  string repository_url = 2;
  string ref = 3;
  string git_connection_id = 4; // Empty for a public repository.
}

// An organization Git credential for private repositories. The token is
// write-only; the platform uses it for AX Workspace setup and run-branch pushes.
message GitConnection {
  string id = 1;
  string host = 2; // github.com or gitlab.com.
  string username = 3; // HTTPS basic-auth user for the token.
  string created_at = 4; // RFC 3339.
}
message ListGitConnectionsRequest {}
message ListGitConnectionsResponse { repeated GitConnection connections = 1; }
message CreateGitConnectionRequest {
  string host = 1; // github.com or gitlab.com.
  string username = 2;
  string token = 3; // Write-only, max 8192 bytes; contents read/write on the repository.
}
message CreateGitConnectionResponse { GitConnection connection = 1; }
message SetProjectSourceResponse { ProjectSource source = 1; }

message VerificationCheck {
  string id = 1;
  repeated string command = 2;
}
message ProjectVerification {
  string project_id = 1;
  int64 version = 2;
  repeated VerificationCheck checks = 3;
  string updated_at = 4; // RFC 3339.
}
message GetProjectVerificationRequest { string project_id = 1; }
message GetProjectVerificationResponse { ProjectVerification verification = 1; }
message SetProjectVerificationRequest {
  string project_id = 1;
  repeated VerificationCheck checks = 2;
}
message SetProjectVerificationResponse { ProjectVerification verification = 1; }

// An organization-owned model connection and project grant. Credential bytes
// are accepted only on creation and are never returned to the browser.
message ProjectModelAccess {
  string id = 1;
  string project_id = 2;
  string provider = 3; // openai or anthropic.
  string model = 4; // Exact provider model identifier.
  string connection_id = 5;
  string grant_id = 6;
  string created_at = 7; // RFC 3339.
}
message ListProjectModelAccessRequest { string project_id = 1; }
message ListProjectModelAccessResponse { repeated ProjectModelAccess access = 1; }
message CreateProjectModelAccessRequest {
  string project_id = 1;
  string provider = 2;
  string model = 3;
  string api_key = 4; // Write-only organization credential, max 8192 bytes.
}
message CreateProjectModelAccessResponse { ProjectModelAccess access = 1; }
message RevokeProjectModelAccessRequest { string access_id = 1; }
message RevokeProjectModelAccessResponse { string access_id = 1; }

// The caller's own coding-plan login for one project model. Only attempts
// whose grantee is the owner may use it; refresh material stays on the
// platform and is never returned.
message SubscriptionConnection {
  string connection_id = 1;
  string project_id = 2;
  string provider = 3; // openai (Codex ChatGPT sign-in).
  string model = 4;
  string account_id = 5; // ChatGPT account ID read from the login; not a secret.
  string state = 6; // active, reconnect_required, or revoked.
  string created_at = 7; // RFC 3339.
}
message ListSubscriptionConnectionsRequest { string project_id = 1; }
message ListSubscriptionConnectionsResponse { repeated SubscriptionConnection connections = 1; }
message CreateSubscriptionConnectionRequest {
  string project_id = 1;
  string provider = 2;
  string model = 3;
  string credential = 4; // Write-only: the contents of ~/.codex/auth.json.
}
message CreateSubscriptionConnectionResponse { SubscriptionConnection connection = 1; }
message RevokeSubscriptionConnectionRequest { string connection_id = 1; }
message RevokeSubscriptionConnectionResponse { string connection_id = 1; }

message ListProjectsRequest {
  int32 page_size = 1; // 1-100; zero selects 50.
  string page_token = 2;
  string search = 3; // Case-insensitive substring of project name or slug.
  string sort_by = 4; // created_at (default) or name.
  string sort_direction = 5; // desc (default) or asc.
}
message ListProjectsResponse {
  repeated Project projects = 1;
  string next_page_token = 2;
}

message GetRunRequest { string run_id = 1; }
message GetRunResponse { Run run = 1; }

message LaunchRunRequest {
  string project_id = 1;
  string launch_key = 2; // Project-scoped idempotency key.
  string recipe_path = 3; // Committed repository path.
  string spec_path = 4; // Committed repository path.
  string transcript_path = 5; // Committed repository path.
  string scope = 6; // Repository-relative code scope.
  // Library recipe version to freeze instead of recipe_path. Its bytes are
  // frozen under the version's path label; prompts and skills come from Git.
  string recipe_version_id = 7;
}
message LaunchRunResponse { Run run = 1; }
message GetLaunchAvailabilityRequest { string project_id = 1; }
message GetLaunchAvailabilityResponse {
  bool enabled = 1;
  string reason = 2; // Actionable when disabled; never contains secret material.
}

message RunTask {
  string id = 1;
  string key = 2;
  string state = 3;
  int64 generation = 4; // Number of reserved attempts.
  int32 max_attempts = 5;
  string active_attempt_id = 6;
  repeated string depends_on = 7; // Frozen stage keys.
  string harness = 8;
  string model = 9;
  string effort = 10;
  repeated FrozenInputFile instruction_files = 11;
  repeated FrozenInputFile skill_files = 12;
  string kind = 13; // Frozen stage kind, e.g. plan, interview, implement, verify.
  string loop_with = 14; // Correction target when this stage owns a loop.
  int32 max_cycles = 15; // Loop cap before escalation, including granted raises.
  int32 loop_cycles = 16; // Corrections this loop has requested so far.
}
message FrozenInputFile { string path = 1; string sha256 = 2; }
message ListRunTasksRequest { string run_id = 1; }
message ListRunTasksResponse { repeated RunTask tasks = 1; }

message ListRunsRequest {
  string project_id = 1;
  int32 page_size = 2; // 1-100; zero selects 50.
  string page_token = 3;
  string search = 4; // Case-insensitive substring of launch key or source commit.
  string sort_by = 5; // created_at (default), launch_key, or state.
  string sort_direction = 6; // desc (default) or asc.
}
message ListRunsResponse {
  repeated Run runs = 1;
  string next_page_token = 2;
}

message EventsAfterRequest {
  string run_id = 1;
  int64 after_id = 2;
  int32 limit = 3; // 1-500; zero selects 100.
}
message EventsAfterResponse {
  repeated WorkflowEvent events = 1;
  int64 next_after_id = 2;
}

// A signed connector readback. It does not verify task success or artifacts.
message CommandExitObservation {
  int64 event_id = 1;
  string task_id = 2;
  string attempt_id = 3;
  string actor_uid = 4;
  string receipt_sha256 = 5;
  int32 exit_code = 6;
  int32 signal = 7;
  bool interrupted = 8;
  int64 observed_at_unix_nanos = 9; // Runner-reported time.
  string received_at = 10; // Database receipt time, RFC 3339.
  string signer_id = 11; // Enrolled connector identity; no signing key is exposed.
}

message ListCommandExitsRequest {
  string run_id = 1;
  int64 after_event_id = 2;
  int32 limit = 3; // 1-100; zero selects 50.
}
message ListCommandExitsResponse {
  repeated CommandExitObservation observations = 1;
  int64 next_after_event_id = 2;
}

message ReviewDecision {
  string id = 1;
  string package_id = 2;
  string principal_id = 3;
  string action = 4; // approve or request_changes.
  string decided_at = 5; // RFC 3339.
  string feedback = 6; // Required for request_changes; empty for approve.
}

message ReviewPackage {
  string id = 1;
  string run_id = 2;
  int64 revision = 3;
  string source_commit = 4;
  string bundle_sha256 = 5;
  string verification_sha256 = 6;
  string integrated_commit = 7;
  string evidence_sha256 = 8;
  string presented_at = 9; // RFC 3339.
  ReviewDecision decision = 10;
}

message GetCurrentReviewRequest { string run_id = 1; }
message GetCurrentReviewResponse { ReviewPackage package = 1; }

message DecideReviewRequest {
  string run_id = 1;
  string package_id = 2;
  string idempotency_key = 3;
  string action = 4; // approve or request_changes.
  string feedback = 5; // 10-4000 characters for request_changes.
}
message DecideReviewResponse { ReviewDecision decision = 1; }

// A structured human interaction raised by a guest (`bx ask`) or by the
// platform (escalation). The first answer wins.
message InteractionOption {
  string id = 1;
  string label = 2;
  string description = 3;
  bool recommended = 4;
}
message InteractionSource {
  string path = 1;
  int32 line = 2;
}
message InteractionInterview {
  int32 round = 1;
  string finalize_option = 2;
}
message InteractionAnswer {
  repeated string option_ids = 1;
  string text = 2;
  string answered_by = 3; // Principal ID.
  string at = 4; // RFC 3339.
}
message Interaction {
  string id = 1;
  string attempt_id = 2; // Empty for platform escalations.
  string stage = 3; // Frozen stage key.
  string kind = 4; // question, approval, escalation, or interview_round.
  string title = 5;
  string body_md = 6;
  repeated InteractionOption options = 7;
  bool multi_select = 8;
  bool allow_free_text = 9;
  bool blocking = 10;
  repeated InteractionSource sources = 11;
  InteractionInterview interview = 12;
  string state = 13; // open, answered, cancelled, or superseded.
  InteractionAnswer answer = 14;
  string created_at = 15; // RFC 3339.
}
message ListInteractionsRequest { string run_id = 1; }
message ListInteractionsResponse { repeated Interaction interactions = 1; }
message AnswerInteractionRequest {
  string interaction_id = 1;
  repeated string option_ids = 2; // Must name stored options.
  string text = 3; // Only when free text is allowed; max 4000 characters.
}
message AnswerInteractionResponse { Interaction interaction = 1; }
message SteerAttemptRequest {
  string attempt_id = 1;
  string kind = 2; // instruction, pause, halt, or set_max_cycles.
  string text = 3; // instruction: 1-4000 characters.
  string reason = 4; // halt: 1-1000 characters.
  int32 n = 5; // set_max_cycles: 1-100.
}
message SteerAttemptResponse { string steer_id = 1; }

// Interactive terminal control. control is "agent" or "human"; the holder is
// set only while a person controls the running attempt. generation advances on
// every holder change.
message AttemptControl {
  string attempt_id = 1;
  string control = 2;
  string holder_principal_id = 3;
  int64 generation = 4;
  string stage = 5;
  string attempt_status = 6;
}

message GetAttemptControlRequest { string attempt_id = 1; }
message GetAttemptControlResponse {
  AttemptControl control = 1;
  // Takeover shows the model API key: org owners and admins, or the owner of
  // the attempt's personal model connection.
  bool can_take_over = 2;
}
message TakeOverAttemptRequest { string attempt_id = 1; }
message TakeOverAttemptResponse { AttemptControl control = 1; }
message HandBackAttemptRequest { string attempt_id = 1; }
message HandBackAttemptResponse { AttemptControl control = 1; }

// Browser requests derive their organization exclusively from a live session.
service WorkflowService {
  rpc CreateProject(CreateProjectRequest) returns (CreateProjectResponse);
  rpc GetProject(GetProjectRequest) returns (GetProjectResponse);
  rpc GetProjectSource(GetProjectSourceRequest) returns (GetProjectSourceResponse);
  rpc SetProjectSource(SetProjectSourceRequest) returns (SetProjectSourceResponse);
  rpc ListGitConnections(ListGitConnectionsRequest) returns (ListGitConnectionsResponse);
  rpc CreateGitConnection(CreateGitConnectionRequest) returns (CreateGitConnectionResponse);
  rpc GetProjectVerification(GetProjectVerificationRequest) returns (GetProjectVerificationResponse);
  rpc SetProjectVerification(SetProjectVerificationRequest) returns (SetProjectVerificationResponse);
  rpc ListProjectModelAccess(ListProjectModelAccessRequest) returns (ListProjectModelAccessResponse);
  rpc CreateProjectModelAccess(CreateProjectModelAccessRequest) returns (CreateProjectModelAccessResponse);
  rpc RevokeProjectModelAccess(RevokeProjectModelAccessRequest) returns (RevokeProjectModelAccessResponse);
  rpc ListSubscriptionConnections(ListSubscriptionConnectionsRequest) returns (ListSubscriptionConnectionsResponse);
  rpc CreateSubscriptionConnection(CreateSubscriptionConnectionRequest) returns (CreateSubscriptionConnectionResponse);
  rpc RevokeSubscriptionConnection(RevokeSubscriptionConnectionRequest) returns (RevokeSubscriptionConnectionResponse);
  rpc ListProjects(ListProjectsRequest) returns (ListProjectsResponse);
  rpc GetRun(GetRunRequest) returns (GetRunResponse);
  rpc LaunchRun(LaunchRunRequest) returns (LaunchRunResponse);
  rpc GetLaunchAvailability(GetLaunchAvailabilityRequest) returns (GetLaunchAvailabilityResponse);
  rpc ListRunTasks(ListRunTasksRequest) returns (ListRunTasksResponse);
  rpc ListRuns(ListRunsRequest) returns (ListRunsResponse);
  rpc EventsAfter(EventsAfterRequest) returns (EventsAfterResponse);
  rpc ListCommandExits(ListCommandExitsRequest) returns (ListCommandExitsResponse);
  rpc GetCurrentReview(GetCurrentReviewRequest) returns (GetCurrentReviewResponse);
  rpc DecideReview(DecideReviewRequest) returns (DecideReviewResponse);
  rpc GetAttemptControl(GetAttemptControlRequest) returns (GetAttemptControlResponse);
  rpc TakeOverAttempt(TakeOverAttemptRequest) returns (TakeOverAttemptResponse);
  rpc HandBackAttempt(HandBackAttemptRequest) returns (HandBackAttemptResponse);
  rpc ListInteractions(ListInteractionsRequest) returns (ListInteractionsResponse);
  rpc AnswerInteraction(AnswerInteractionRequest) returns (AnswerInteractionResponse);
  rpc SteerAttempt(SteerAttemptRequest) returns (SteerAttemptResponse);
}
