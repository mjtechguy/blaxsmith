replicaCount: 1
ha:
  enabled: false # Requires at least two replicas and Kubernetes 1.30+.
migrationJob:
  name: "" # Only set when rendering a one-off Job after quiescing all app pods.
image: "" # Immutable Dockerfile app target, repository@sha256:digest.
imagePullPolicy: IfNotPresent
imagePullSecrets: []
origin: "" # Exact public HTTPS origin covered by tlsSecretName.
tlsSecretName: "" # Existing kubernetes.io/tls Secret.
signerSecretName: "" # Existing Secret with a 32-byte seed under key seed.
previousSignerPublicSecretName: "" # Optional Secret with a 32-byte public key under key public.
databaseSecretName: "" # Existing Secret with PostgreSQL URL under key url; verified TLS required.
databaseCASecretName: "" # Optional existing Secret with ca.crt; set for a private PostgreSQL CA.
accessKeySecretName: "" # Optional existing Secret with a 32-byte raw encryption key under key key.
accessKeyID: "" # Optional ID of the key in accessKeySecretName; empty means "primary". Give each new key a new ID.
previousAccessKeys: [] # Optional older keys kept during rotation, e.g. [{id: primary, secretName: old-access-key}], 32 bytes under key key.
dispatch:
  enabled: false # Requires the packaged AX/Substrate CLIs and a pod-local AX tunnel.
  egressMode: exact # exact is default; open-dev requires dev.allowOpenEgress=true.
  dev:
    allowOpenEgress: false # Explicit development-only switch for an unrestricted AX Gateway.
  credentialsSecretName: "" # Existing Secret with substrate-token, substrate-ca.pem, router-ca.pem, actor-ca.pem, bootstrap-token, bootstrap-signer.
  tools:
    image: "" # Immutable image with ax, kubectl-ate, and socat; CLIs copied by init container.
  tunnel:
    targetHost: ax-server.ax-system.svc.cluster.local
    targetPort: 8080
    localPort: 18443
  ax:
    cliSHA256: "" # SHA-256 of /usr/local/bin/ax in tools.image.
  substrate:
    cliSHA256: "" # SHA-256 of /usr/local/bin/kubectl-ate in tools.image.
    endpoint: ""
  bootstrap:
    routerURL: "" # HTTPS origin for the AX bootstrap router.
  clusterID: ""
  leaseTTL: "" # Go duration, positive and <= 1h.
  workerImage: "" # Immutable AX task-runner image reference.
  workerPool: ""
  snapshotStorage: ""
  workspace: ""
  gateway: ""
  # In-cluster atenet-router host:port for live terminals, takeover, guest
  # result reads, and lease renewal notices. Empty disables them (terminals 503).
  guestRouter: ""
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 512Mi
# Model gateway (docs/model-gateway-plan.md §2, §15.1). Off by default: when
# false no gateway Deployment exists, the app gets no BLAXSMITH_GATEWAY_URL,
# and the organization switch in Admin → Settings → Model gateway cannot be
# turned on. Requires accessKeySecretName.
gateway:
  enabled: false
  replicaCount: 1 # Rate limits are per replica (see internal/gateway/ratelimit.go).
  # URL sandboxes call, e.g. https://gw.example.com. Under exact AX egress it
  # must resolve to public IPv4 addresses (an ingress or LoadBalancer in front
  # of the Service); it replaces provider hosts in brokered attempts' egress.
  publicURL: ""
  tlsSecretName: "" # kubernetes.io/tls Secret; empty serves plain HTTP behind a TLS-terminating proxy.
  tokenRPS: 10 # per-token request rate
  orgRPS: 100 # per-organization request rate
  eventRetention: 2160h # raw usage events (90 days); rollups are kept
  drainTimeoutSeconds: 900 # in-flight streams may finish this long on shutdown
  service:
    type: ClusterIP
    port: 8443
  networkPolicy:
    enabled: true
    ingressFrom: [] # NetworkPolicy peers allowed to reach the gateway port; empty allows any source.
    databaseTo: [] # peers for PostgreSQL egress; empty allows any destination on databasePort.
    databasePort: 5432
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi
