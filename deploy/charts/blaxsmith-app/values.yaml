replicaCount: 1
ha:
  enabled: false # Requires at least two replicas and Kubernetes 1.30+.
migrationJob:
  name: "" # Only set when rendering a one-off Job after quiescing all app pods.
image: "" # Immutable Dockerfile app target, repository@sha256:digest.
imagePullPolicy: IfNotPresent
imagePullSecrets: []
runLaunchEnabled: false # Enable only when the dispatcher and credential release path are operating.
origin: "" # Exact public HTTPS origin covered by tlsSecretName.
tlsSecretName: "" # Existing kubernetes.io/tls Secret.
signerSecretName: "" # Existing Secret with a 32-byte seed under key seed.
previousSignerPublicSecretName: "" # Optional Secret with a 32-byte public key under key public.
databaseSecretName: "" # Existing Secret with PostgreSQL URL under key url; verified TLS required.
databaseCASecretName: "" # Optional existing Secret with ca.crt; set for a private PostgreSQL CA.
accessKeySecretName: "" # Optional existing Secret with a 32-byte raw encryption key under key key.
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 512Mi
