{{- if not (regexMatch "^.+@sha256:[a-f0-9]{64}$" .Values.image) -}}
{{- fail "image must be an immutable repository@sha256:<64 hex> reference" -}}
{{- end -}}
{{- range $name := list "origin" "tlsSecretName" "signerSecretName" "databaseSecretName" -}}
{{- if not (index $.Values $name) -}}
{{- fail (printf "%s is required" $name) -}}
{{- end -}}
{{- end -}}
{{- if and (gt (int .Values.replicaCount) 1) (not .Values.ha.enabled) -}}
{{- fail "replicaCount > 1 requires ha.enabled=true" -}}
{{- end -}}
{{- if and .Values.ha.enabled (lt (int .Values.replicaCount) 2) -}}
{{- fail "ha.enabled requires replicaCount >= 2" -}}
{{- end -}}
{{- if and .Values.ha.enabled (not (semverCompare ">=1.30.0-0" .Capabilities.KubeVersion.Version)) -}}
{{- fail "ha.enabled requires Kubernetes 1.30+ for topologySpreadConstraints.minDomains" -}}
{{- end -}}
{{- if .Values.dispatch.enabled -}}
{{- $d := .Values.dispatch -}}
{{- range $value := list $d.credentialsSecretName $.Values.accessKeySecretName $d.tools.image $d.tunnel.targetHost $d.ax.cliSHA256 $d.substrate.cliSHA256 $d.substrate.endpoint $d.bootstrap.routerURL $d.clusterID $d.leaseTTL $d.workerImage $d.workerPool $d.snapshotStorage $d.workspace $d.gateway -}}
{{- if not $value -}}
{{- fail "dispatch.enabled requires every dispatch setting, accessKeySecretName, and credentialsSecretName" -}}
{{- end -}}
{{- end -}}
{{- if or (not (regexMatch "^[0-9a-f]{64}$" $d.ax.cliSHA256)) (not (regexMatch "^[0-9a-f]{64}$" $d.substrate.cliSHA256)) -}}
{{- fail "dispatch CLI SHA-256 values must be 64 lowercase hex characters" -}}
{{- end -}}
{{- if not (regexMatch "^.+@sha256:[a-f0-9]{64}$" $d.tools.image) -}}
{{- fail "dispatch.tools.image must be an immutable repository@sha256:<64 hex> reference" -}}
{{- end -}}
{{- if not (regexMatch "^.+@sha256:[a-f0-9]{64}$" $d.workerImage) -}}
{{- fail "dispatch.workerImage must be an immutable repository@sha256:<64 hex> reference" -}}
{{- end -}}
{{- if or (lt (int $d.tunnel.localPort) 1024) (gt (int $d.tunnel.localPort) 65535) (lt (int $d.tunnel.targetPort) 1) (gt (int $d.tunnel.targetPort) 65535) -}}
{{- fail "dispatch tunnel ports are outside their valid TCP ranges" -}}
{{- end -}}
{{- if and (ne $d.egressMode "exact") (ne $d.egressMode "open-dev") -}}
{{- fail "dispatch.egressMode must be exact or open-dev" -}}
{{- end -}}
{{- if and (eq $d.egressMode "open-dev") (not $d.dev.allowOpenEgress) -}}
{{- fail "dispatch.egressMode=open-dev requires dispatch.dev.allowOpenEgress=true" -}}
{{- end -}}
{{- if and $d.dev.allowOpenEgress (ne $d.egressMode "open-dev") -}}
{{- fail "dispatch.dev.allowOpenEgress=true requires dispatch.egressMode=open-dev" -}}
{{- end -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-app
  labels:
    app.kubernetes.io/name: blaxsmith-app
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  {{- if .Values.ha.enabled }}
  minReadySeconds: 5
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: blaxsmith-app
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: blaxsmith-app
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      automountServiceAccountToken: false
      {{- if .Values.ha.enabled }}
      topologySpreadConstraints:
        - maxSkew: 1
          minDomains: 2
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: blaxsmith-app
              app.kubernetes.io/instance: {{ .Release.Name }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.dispatch.enabled }}
      initContainers:
        - name: copy-dispatch-tools
          image: {{ .Values.dispatch.tools.image | quote }}
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-ec"]
          args:
            - test -x /usr/local/bin/ax; test -x /usr/local/bin/kubectl-ate; cp /usr/local/bin/ax /dispatch-tools/ax; cp /usr/local/bin/kubectl-ate /dispatch-tools/kubectl-ate; chmod 0555 /dispatch-tools/ax /dispatch-tools/kubectl-ate
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: dispatch-tools
              mountPath: /dispatch-tools
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      containers:
        - name: app
          image: {{ .Values.image | quote }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          args:
            - serve-app
            {{- if .Values.dispatch.enabled }}
            - --enable-dispatch
            {{- if .Values.dispatch.dev.allowOpenEgress }}
            - --allow-open-egress-dev
            {{- end }}
            {{- end }}
            {{- if .Values.ha.enabled }}
            - --migrations
            - verify
            {{- end }}
            - --listen
            - 0.0.0.0:8443
            - --origin
            - {{ .Values.origin | quote }}
            - --tls-cert-file
            - /run/blaxsmith/tls/tls.crt
            - --tls-key-file
            - /run/blaxsmith/tls/tls.key
            - --signer-file
            - /run/blaxsmith/signer/seed
            {{- if .Values.previousSignerPublicSecretName }}
            - --previous-signer-public-file
            - /run/blaxsmith/previous-signer/public
            {{- end }}
            - --static-dir
            - /srv
          env:
            - name: BLAXSMITH_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.databaseSecretName | quote }}
                  key: url
            {{- if .Values.accessKeySecretName }}
            - name: BLAXSMITH_ACCESS_KEY_FILE
              value: /run/blaxsmith/access-key/key
            {{- end }}
            {{- if .Values.dispatch.enabled }}
            - name: BLAXSMITH_DISPATCH_AX_SERVER
              value: {{ printf "http://127.0.0.1:%v" .Values.dispatch.tunnel.localPort | quote }}
            - name: BLAXSMITH_DISPATCH_AX_CLI
              value: /opt/blaxsmith/dispatch-tools/ax
            - name: BLAXSMITH_DISPATCH_AX_CLI_SHA256
              value: {{ .Values.dispatch.ax.cliSHA256 | quote }}
            - name: BLAXSMITH_DISPATCH_SUBSTRATE_CLI
              value: /opt/blaxsmith/dispatch-tools/kubectl-ate
            - name: BLAXSMITH_DISPATCH_SUBSTRATE_CLI_SHA256
              value: {{ .Values.dispatch.substrate.cliSHA256 | quote }}
            - name: BLAXSMITH_DISPATCH_SUBSTRATE_ENDPOINT
              value: {{ .Values.dispatch.substrate.endpoint | quote }}
            - name: BLAXSMITH_DISPATCH_SUBSTRATE_TOKEN_FILE
              value: /run/blaxsmith/dispatch/substrate-token
            - name: BLAXSMITH_DISPATCH_SUBSTRATE_CA_FILE
              value: /run/blaxsmith/dispatch/substrate-ca.pem
            - name: BLAXSMITH_DISPATCH_BOOTSTRAP_ROUTER_URL
              value: {{ .Values.dispatch.bootstrap.routerURL | quote }}
            - name: BLAXSMITH_DISPATCH_BOOTSTRAP_ROUTER_CA_FILE
              value: /run/blaxsmith/dispatch/router-ca.pem
            - name: BLAXSMITH_DISPATCH_BOOTSTRAP_ACTOR_CA_FILE
              value: /run/blaxsmith/dispatch/actor-ca.pem
            - name: BLAXSMITH_DISPATCH_BOOTSTRAP_TOKEN_FILE
              value: /run/blaxsmith/dispatch/bootstrap-token
            - name: BLAXSMITH_DISPATCH_BOOTSTRAP_SIGNER_FILE
              value: /run/blaxsmith/dispatch/bootstrap-signer
            - name: BLAXSMITH_DISPATCH_CLUSTER_ID
              value: {{ .Values.dispatch.clusterID | quote }}
            - name: BLAXSMITH_DISPATCH_LEASE_TTL
              value: {{ .Values.dispatch.leaseTTL | quote }}
            - name: BLAXSMITH_DISPATCH_WORKER_IMAGE
              value: {{ .Values.dispatch.workerImage | quote }}
            - name: BLAXSMITH_DISPATCH_WORKER_POOL
              value: {{ .Values.dispatch.workerPool | quote }}
            - name: BLAXSMITH_DISPATCH_SNAPSHOT_STORAGE
              value: {{ .Values.dispatch.snapshotStorage | quote }}
            - name: BLAXSMITH_DISPATCH_WORKSPACE
              value: {{ .Values.dispatch.workspace | quote }}
            - name: BLAXSMITH_DISPATCH_GATEWAY
              value: {{ .Values.dispatch.gateway | quote }}
            - name: BLAXSMITH_DISPATCH_EGRESS_MODE
              value: {{ .Values.dispatch.egressMode | quote }}
            {{- end }}
            {{- if .Values.gateway.enabled }}
            - name: BLAXSMITH_GATEWAY_URL
              value: {{ .Values.gateway.publicURL | quote }}
            {{- end }}
            {{- with .Values.dispatch.guestRouter }}
            - name: BLAXSMITH_GUEST_ROUTER
              value: {{ . | quote }}
            {{- end }}
          ports:
            - name: https
              containerPort: 8443
          startupProbe:
            httpGet:
              path: /healthz
              port: https
              scheme: HTTPS
            periodSeconds: 2
            failureThreshold: 45
          readinessProbe:
            httpGet:
              path: /healthz
              port: https
              scheme: HTTPS
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /livez
              port: https
              scheme: HTTPS
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: scratch
              mountPath: /tmp
            - name: tls
              mountPath: /run/blaxsmith/tls
              readOnly: true
            - name: signer
              mountPath: /run/blaxsmith/signer
              readOnly: true
            {{- if .Values.accessKeySecretName }}
            - name: access-key
              mountPath: /run/blaxsmith/access-key
              readOnly: true
            {{- end }}
            {{- if .Values.databaseCASecretName }}
            - name: database-ca
              mountPath: /run/blaxsmith/database-ca
              readOnly: true
            {{- end }}
            {{- if .Values.previousSignerPublicSecretName }}
            - name: previous-signer
              mountPath: /run/blaxsmith/previous-signer
              readOnly: true
            {{- end }}
            {{- if .Values.dispatch.enabled }}
            - name: dispatch-tools
              mountPath: /opt/blaxsmith/dispatch-tools
              readOnly: true
            - name: dispatch-credentials
              mountPath: /run/blaxsmith/dispatch
              readOnly: true
            {{- end }}
        {{- if .Values.dispatch.enabled }}
        - name: ax-tunnel
          image: {{ .Values.dispatch.tools.image | quote }}
          imagePullPolicy: IfNotPresent
          command: ["socat"]
          args:
            - {{ printf "TCP-LISTEN:%v,bind=127.0.0.1,reuseaddr,fork" .Values.dispatch.tunnel.localPort | quote }}
            - {{ printf "TCP:%s:%v" .Values.dispatch.tunnel.targetHost .Values.dispatch.tunnel.targetPort | quote }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
        {{- end }}
      volumes:
        - name: scratch
          emptyDir:
            sizeLimit: 1Gi
        - name: tls
          secret:
            secretName: {{ .Values.tlsSecretName | quote }}
            defaultMode: 288 # 0440, readable by fsGroup; never world-readable.
        - name: signer
          secret:
            secretName: {{ .Values.signerSecretName | quote }}
            defaultMode: 288
        {{- if .Values.dispatch.enabled }}
        - name: dispatch-tools
          emptyDir: {}
        {{- end }}
        {{- if .Values.accessKeySecretName }}
        - name: access-key
          secret:
            secretName: {{ .Values.accessKeySecretName | quote }}
            items:
              - key: key
                path: key
            defaultMode: 288
        {{- end }}
        {{- if .Values.databaseCASecretName }}
        - name: database-ca
          secret:
            secretName: {{ .Values.databaseCASecretName | quote }}
            items:
              - key: ca.crt
                path: ca.crt
            defaultMode: 288
        {{- end }}
        {{- if .Values.previousSignerPublicSecretName }}
        - name: previous-signer
          secret:
            secretName: {{ .Values.previousSignerPublicSecretName | quote }}
            defaultMode: 288
        {{- end }}
        {{- if .Values.dispatch.enabled }}
        - name: dispatch-credentials
          secret:
            secretName: {{ .Values.dispatch.credentialsSecretName | quote }}
            defaultMode: 288
            items:
              - key: substrate-token
                path: substrate-token
              - key: substrate-ca.pem
                path: substrate-ca.pem
              - key: router-ca.pem
                path: router-ca.pem
              - key: actor-ca.pem
                path: actor-ca.pem
              - key: bootstrap-token
                path: bootstrap-token
              - key: bootstrap-signer
                path: bootstrap-signer
        {{- end }}
