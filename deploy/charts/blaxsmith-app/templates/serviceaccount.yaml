{{- if .Values.dispatch.guestRouterToken.projected }}
# Guest-router identity: system:serviceaccount:<namespace>:<release>-app. It
# has no RBAC; the router only TokenReviews its projected token.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-app
  labels:
    app.kubernetes.io/name: blaxsmith-app
    app.kubernetes.io/instance: {{ .Release.Name }}
automountServiceAccountToken: false
{{- end }}
