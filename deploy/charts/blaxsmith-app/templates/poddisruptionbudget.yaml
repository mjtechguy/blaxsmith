{{- if .Values.ha.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ .Release.Name }}-app
  labels:
    app.kubernetes.io/name: blaxsmith-app
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: blaxsmith-app
      app.kubernetes.io/instance: {{ .Release.Name }}
{{- end }}
