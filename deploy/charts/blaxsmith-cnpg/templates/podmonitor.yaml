{{- if .Values.monitoring.podMonitor }}
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: {{ .Release.Name }}
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: {{ .Release.Name }}
  podMetricsEndpoints:
    - port: metrics
      scheme: https
      tlsConfig:
        ca:
          secret:
            name: {{ .Values.serverCASecretName | quote }}
            key: ca.crt
        serverName: {{ .Release.Name }}-rw
{{- end }}
