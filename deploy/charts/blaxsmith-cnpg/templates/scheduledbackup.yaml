apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: {{ .Release.Name }}-base
spec:
  schedule: {{ .Values.backup.schedule | quote }}
  immediate: true
  backupOwnerReference: self
  cluster:
    name: {{ .Release.Name }}
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
