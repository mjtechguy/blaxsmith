{{- if not (regexMatch "^.+@sha256:[a-f0-9]{64}$" .Values.apiImage) -}}
{{- fail "apiImage must be an immutable image reference ending in @sha256:<64 hex characters>" -}}
{{- end -}}
{{- if not (regexMatch "^.+@sha256:[a-f0-9]{64}$" .Values.webImage) -}}
{{- fail "webImage must be an immutable image reference ending in @sha256:<64 hex characters>" -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-preview
  labels:
    app.kubernetes.io/name: blaxsmith-preview
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: blaxsmith-preview
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: blaxsmith-preview
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      containers:
        - name: api
          image: {{ .Values.apiImage | quote }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          args: ["serve", "--port", "8001"]
          ports:
            - name: api-loopback
              containerPort: 8001
          resources:
            {{- toYaml .Values.apiResources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
        - name: web
          image: {{ .Values.webImage | quote }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          startupProbe:
            exec:
              command: ["/bin/sh", "-ec", "nc -z 127.0.0.1 8001 && wget -q -O /dev/null http://127.0.0.1:8080/"]
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            exec:
              command: ["/bin/sh", "-ec", "nc -z 127.0.0.1 8001 && wget -q -O /dev/null http://127.0.0.1:8080/"]
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          resources:
            {{- toYaml .Values.webResources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
