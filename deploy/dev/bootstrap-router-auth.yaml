apiVersion: v1
kind: ServiceAccount
metadata:
  name: blaxsmith-connector
  namespace: ate-system
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: blaxsmith-router-tokenreview
rules:
- apiGroups: [authentication.k8s.io]
  resources: [tokenreviews]
  verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: blaxsmith-router-tokenreview
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: blaxsmith-router-tokenreview
subjects:
- kind: ServiceAccount
  name: atenet-router
  namespace: ate-system
