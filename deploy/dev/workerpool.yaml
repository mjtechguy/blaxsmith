# Render both placeholders from the pinned Substrate build before applying.
apiVersion: ate.dev/v1alpha1
kind: WorkerPool
metadata:
  name: blaxsmith-smoke
  namespace: ax-system
spec:
  replicas: 1
  workerImage: __WORKER_IMAGE__
  template:
    nodeSelector:
      ate.dev/substrate-version: __SUBSTRATE_VERSION__
    resources:
      requests:
        cpu: 250m
        memory: 1Gi
      limits:
        cpu: "1"
        memory: 1Gi
